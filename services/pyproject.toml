[project]
name = "duta"
version = "0.1.0"
description = "Meridian application-triage pilot (staged FDE engagement)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "psycopg[binary]>=3.1",
    "temporalio>=1.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["duta*"]

[tool.ruff]
line-length = 110
target-version = "py311"
